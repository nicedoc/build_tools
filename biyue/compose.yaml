version: '3'
services:
  registry:
    image: registry:2
    container_name: registry
    restart: always
    ports:
    - "5000:5000"
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Registry-Realm
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/registry.passwd
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /data
    volumes:
      - registrydata:/data
      - ./auth:/auth
    networks:
      - mynet

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    tty: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/:/etc/nginx/conf.d/
      - /etc/certs/:/etc/nginx/ssl/
      - ./download/:/download/
    networks:
      - mynet
      - oonet
  
  onlyoffice:
    image: registry.nicedoc.cn/nicedoc-documentserver:latest
    #image: nicedoc-documentserver:8.2.0-176
    container_name: onlyoffice  
    depends_on:
      - registry
      - onlyoffice-postgresql
      - onlyoffice-rabbitmq
    restart: always
    ports:
      - "1080:80"
      - "1443:443"
    environment:
      - PRODUCT_NAME:=documentserver
      - DB_TYPE=postgres
      - DB_HOST=onlyoffice-postgresql
      - DB_PORT=5432
      - DB_NAME=onlyoffice
      - DB_USER=onlyoffice
      - AMQP_URI=amqp://guest:guest@onlyoffice-rabbitmq
    volumes:
      - /usr/share/fonts/truetype/custom
      - /home/houmingyuan/app/onlyoffice/var/lib/onlyoffice:/var/lib/onlyoffice
      - /home/houmingyuan/app/onlyoffice/var/lib/redis:/var/lib/redis
      - /var/log/onlyoffice
      - /home/houmingyuan/app/onlyoffice/data:/var/www/onlyoffice/Data
      - plugin_data:/var/www/onlyoffice/documentserver/sdkjs-plugins/biyue
    networks:
      - oonet
  
  onlyoffice-rabbitmq:
    container_name: onlyoffice-rabbitmq
    image: rabbitmq
    restart: always
    expose:
      - '5672'
    volumes:
      - /home/houmingyuan/app/onlyoffice/var/lib/rabbitmq:/var/lib/rabbitmq
    networks:
      - oonet

  onlyoffice-postgresql:
    container_name: onlyoffice-postgresql
    image: postgres:14
    environment:
      - POSTGRES_DB=onlyoffice
      - POSTGRES_USER=onlyoffice
      - POSTGRES_HOST_AUTH_METHOD=trust
    restart: always
    expose:
      - '5432'
    volumes:
      - postgresql_data:/var/lib/postgresql
    networks:
      - oonet

  onlyoffice-biyueplugin:
    container_name: onlyoffice-biyueplugin
    image: registry.nicedoc.cn/biyue-plugin:master
    restart: always
    volumes:
      - plugin_data:/var/www/onlyoffice/documentserver/sdkjs-plugins/biyue


networks:
  mynet:
    driver: bridge
  oonet:
    driver: bridge

volumes:
  plugin_data:
  postgresql_data:
  registrydata:
    driver: local

